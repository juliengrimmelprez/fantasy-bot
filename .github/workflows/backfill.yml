name: Backfill report

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to look back"
        default: "7"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report (sends nothing)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          BACKFILL_DAYS: ${{ inputs.days }}
        run: |
          mkdir -p reports
          python scripts/backfill.py | tee reports/backfill.md
      - name: Save report to repo
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add reports/backfill.md
          git diff --cached --quiet || git commit -m "backfill report" -q
          git pull --rebase -q || true
          git push -q
